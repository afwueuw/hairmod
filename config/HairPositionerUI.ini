[Hotkey]
; Keyboard scan code: F3 = 61. Set 0 to disable.
; Can also be changed in the HairPositioner UI settings.
Key=61

[Editing]
; 0 = fine, 1 = normal, 2 = coarse
Precision=1

[Persistence]
; 1 = save adjustment presets outside game saves and auto-apply when targets become available
; 0 = disable external preset saving and auto-application
Enabled=1
