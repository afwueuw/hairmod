
name: Build HairPositionerUI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure and build DLL
        shell: pwsh
        run: |
          xmake --version
          xmake f -m releasedbg -a x64 --vs=2026 -y
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          xmake build -j6 HairPositionerUI
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package test mod
        shell: pwsh
        run: |
          $dll = "build/bin/HairPositionerUI.dll"

          if (!(Test-Path $dll)) {
            throw "Build failed: DLL not found"
          }

          New-Item -ItemType Directory `
            -Force -Path "package/SKSE/Plugins" | Out-Null

          Copy-Item $dll "package/SKSE/Plugins/"

          Copy-Item "config/HairPositionerUI.ini" `
            "package/SKSE/Plugins/"

          Compress-Archive `
            -Path "package/*" `
            -DestinationPath "HairPositionerUI-test.zip" `
            -Force

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: HairPositionerUI-test
          path: HairPositionerUI-test.zip
          if-no-files-found: error
